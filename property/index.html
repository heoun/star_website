<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Details | Star Real Estate</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1f2a33;
      --text: #4c5963;
      --bg: #f7f6f1;
      --panel: #ffffff;
      --line: rgba(31, 42, 51, 0.14);
      --primary: #0d3b52;
      --primary-soft: #dce9ef;
      --accent: #c1752e;
      --page-bg-image: url("../jpg/unit-bkg.jpeg");
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --shadow: 0 20px 38px rgba(13, 59, 82, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Public Sans", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: var(--page-bg-image) center / cover fixed no-repeat;
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -32px;
      z-index: 0;
      pointer-events: none;
      background: var(--page-bg-image) center / cover fixed no-repeat;
      filter: blur(7px) saturate(1.04);
      opacity: 0.58;
      transform: scale(1.018);
    }

    body.nav-open { overflow: hidden; }

    .site {
      max-width: 1160px;
      margin: 0 auto;
      padding: 22px 18px 70px;
      overflow-x: clip;
      position: relative;
      z-index: 1;
    }

    .breadcrumb {
      margin: 22px 0 14px;
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(12, 31, 40, 0.5);
    }

    .breadcrumb a { color: #ffffff; text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }

    .sheet {
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .state {
      padding: 60px 24px;
      text-align: center;
      color: var(--text);
      font-weight: 600;
    }

    /* ---- Gallery ---- */

    .stage {
      position: relative;
      background: #0c1f28;
      aspect-ratio: 16 / 9;
    }

    .stage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .stage .caption {
      position: absolute;
      left: 16px;
      bottom: 16px;
      background: rgba(12, 31, 40, 0.66);
      color: #ffffff;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 700;
      backdrop-filter: blur(6px);
    }

    .stage .status {
      position: absolute;
      right: 16px;
      top: 16px;
      background: var(--accent);
      color: #ffffff;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .stage button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.9);
      color: var(--primary);
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: 0 6px 18px rgba(12, 31, 40, 0.25);
    }

    .stage button:hover { background: #ffffff; }
    .stage .prev { left: 14px; }
    .stage .next { right: 14px; }

    .thumbs {
      display: flex;
      gap: 10px;
      padding: 12px 16px;
      overflow-x: auto;
      border-bottom: 1px solid var(--line);
      background: #fbfaf7;
    }

    .thumbs img {
      width: 96px;
      height: 68px;
      object-fit: cover;
      border-radius: 10px;
      cursor: pointer;
      flex-shrink: 0;
      border: 2px solid transparent;
      opacity: 0.75;
      transition: opacity .2s, border-color .2s;
    }

    .thumbs img:hover { opacity: 1; }
    .thumbs img[aria-current="true"] { border-color: var(--primary); opacity: 1; }

    /* ---- Body ---- */

    .content {
      display: grid;
      grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
      gap: 30px;
      padding: 26px;
    }

    .price {
      font-family: "Sora", system-ui, sans-serif;
      font-size: 34px;
      font-weight: 800;
      color: var(--primary);
      margin: 0;
      line-height: 1.1;
    }

    h1 {
      font-family: "Sora", system-ui, sans-serif;
      font-size: 24px;
      font-weight: 700;
      margin: 8px 0 4px;
      line-height: 1.25;
    }

    .address { margin: 0; color: var(--text); font-size: 15px; }

    .facts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 18px 0 0;
    }

    .fact {
      background: var(--primary-soft);
      color: var(--primary);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 700;
    }

    h2 {
      font-family: "Sora", system-ui, sans-serif;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--primary);
      margin: 28px 0 10px;
    }

    .description { margin: 0; color: var(--text); line-height: 1.7; white-space: pre-line; }

    .media-block img,
    .media-block video {
      width: 100%;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      display: block;
    }

    .media-block video { background: #000; }

    .aside {
      align-self: start;
      position: sticky;
      top: 22px;
      background: #fbfaf7;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 20px;
    }

    .aside h2 { margin-top: 0; }
    .aside dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 14px; }
    .aside dt { color: var(--text); }
    .aside dd { margin: 0; font-weight: 700; text-align: right; }

    .cta {
      display: block;
      margin-top: 18px;
      background: var(--primary);
      color: #ffffff;
      text-align: center;
      text-decoration: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-weight: 800;
      font-size: 14px;
    }

    .cta:hover { background: #0a2e41; }

    .cta.secondary {
      background: transparent;
      color: var(--primary);
      border: 1px solid var(--primary);
      margin-top: 10px;
    }

    @media (max-width: 860px) {
      .content { grid-template-columns: 1fr; padding: 20px; }
      .aside { position: static; }
      .price { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="site">
    <!-- SHARED_HEADER {"depth": 1, "currentNav": null} -->

    <p class="breadcrumb"><a href="../rental/">← Back to listings</a></p>

    <main class="sheet" id="property">
      <p class="state">Loading property…</p>
    </main>
  </div>

  <script src="../shared/property-page.js"></script>
</body>
</html>
