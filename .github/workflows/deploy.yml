# Production is explicitly promoted through release.yml after Dev acceptance.
# A push to main validates code; it no longer bypasses the release gate.
name: Production release instructions
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  instructions:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Use Release a verified revision to deploy this commit to staging, then promote the same SHA to production.'
