name: Release a verified revision
on:
  push:
    branches: [haiyang_dev]
  workflow_dispatch:
    inputs:
      target:
        description: Deploy to Dev first; production requires the same revision on Dev
        type: choice
        options: [staging, production]
        required: true
      revision:
        description: Full 40-character commit SHA to release
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: star-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Validate exact revision
        env:
          REVISION: ${{ inputs.revision || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$REVISION"
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run test:release
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - name: Check target readiness before changing any services
        env:
          TARGET: ${{ inputs.target || 'staging' }}
        run: node scripts/release.mjs "$TARGET" --check
      - name: Publish Dev simulator
        if: github.event_name == 'push' || inputs.target == 'staging'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --no-install wrangler deploy --config testing/screening/wrangler.jsonc
      - name: Check database and release
        env:
          STAR_CI_GATE: passed
          TARGET: ${{ inputs.target || 'staging' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/release.mjs "$TARGET"
