<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no,address=no">
  <meta name="robots" content="noindex, nofollow">
  <title>Applicant Portal | Star Real Estate</title>
  <!-- INLINE_BRAND_ICON -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1f2a33;
      --text: #4c5963;
      --bg: #f7f6f1;
      --panel: #ffffff;
      --line: rgba(31, 42, 51, 0.14);
      --primary: #0d3b52;
      --primary-soft: #dce9ef;
      --accent: #c1752e;
      --danger: #b3261e;
      --good: #2e7d32;
      --page-bg-image: url("../jpg/unit-bkg.jpeg");
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --shadow: 0 20px 38px rgba(13, 59, 82, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Public Sans", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: var(--page-bg-image) center / cover fixed no-repeat;
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -32px;
      z-index: 0;
      pointer-events: none;
      background: var(--page-bg-image) center / cover fixed no-repeat;
      filter: blur(7px) saturate(1.04);
      opacity: 0.58;
      transform: scale(1.018);
    }

    body.nav-open { overflow: hidden; }

    .site {
      max-width: 1160px;
      margin: 0 auto;
      padding: 22px 18px 70px;
      overflow-x: clip;
      position: relative;
      z-index: 1;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(12, 31, 40, 0.46);
      border-radius: 18px;
      box-shadow: 0 18px 34px rgba(12, 31, 40, 0.14);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      text-decoration: none;
      color: #ffffff;
    }

    .brand-mark {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 14px 26px rgba(12, 31, 40, 0.2);
      overflow: hidden;
      flex-shrink: 0;
    }

    .brand-mark svg {
      width: 100%;
      height: 100%;
      display: block;
      color: #0d3b52;
    }

    .brand-copy h1 {
      margin: 0;
      font-family: "Sora", sans-serif;
      font-size: 20px;
      line-height: 1.15;
      text-transform: uppercase;
      letter-spacing: 0.25px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }

    .desktop-nav {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .desktop-nav a {
      text-decoration: none;
      color: rgba(255, 255, 255, 0.78);
      padding: 0 16px;
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      isolation: isolate;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
    }

    .desktop-nav a:hover,
    .desktop-nav a[aria-current="page"] {
      background: transparent;
      color: #ffffff;
    }

    .desktop-nav a::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: calc(100% - 14px);
      min-width: 46px;
      height: 30px;
      border-radius: 10px;
      background: transparent;
      transform: translate(-50%, -50%);
      transition: background-color 180ms ease;
      z-index: -1;
    }

    .desktop-nav a:hover::before,
    .desktop-nav a[aria-current="page"]::before {
      background: rgba(255, 255, 255, 0.14);
    }

    .desktop-nav a.intent-nav {
      min-width: 76px;
      padding: 0 18px;
      text-align: center;
    }

    .menu-toggle {
      display: none;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      font-size: 18px;
      cursor: pointer;
    }

    .mobile-nav {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(31, 42, 51, 0.62);
      padding: 16px;
      align-items: center;
      justify-content: center;
    }

    .mobile-nav.open {
      display: flex;
    }

    .mobile-sheet {
      width: min(360px, 100%);
      background: rgba(12, 31, 40, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 15px;
      padding: 14px;
      box-shadow: var(--shadow);
      display: grid;
      gap: 8px;
    }

    .mobile-sheet a,
    .close-nav {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      padding: 10px 12px;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.82);
      font-size: 13px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.08);
      text-align: left;
    }

    .mobile-sheet a[aria-current="page"] {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
    }

    .mobile-sheet a.intent-nav {
      min-height: 48px;
      padding: 14px;
      font-size: 14px;
      font-weight: 800;
    }

    .close-nav {
      cursor: pointer;
      font-family: inherit;
      color: #ffffff;
    }

    /* ------------------------------------------------------- the sheet */

    .sheet {
      max-width: 860px;
      margin: 22px auto 0;
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 26px;
    }

    .state {
      padding: 40px 12px;
      text-align: center;
      color: var(--text);
      font-weight: 600;
    }

    .sheet h1 {
      font-family: "Sora", system-ui, sans-serif;
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 6px;
      line-height: 1.25;
      color: var(--primary);
    }

    .lede { margin: 0 0 20px; color: var(--text); font-size: 14.5px; line-height: 1.55; }
    .lede a { color: var(--primary); font-weight: 700; }

    .num { font-variant-numeric: tabular-nums; }

    /* ------------------------------------------------- signing in & forms */

    .portal-login { max-width: 420px; display: grid; gap: 5px; margin: 0 0 18px; }

    .portal-login label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin: 10px 0 0;
    }

    .portal-login label:first-child { margin-top: 0; }
    .hint { font-weight: 400; color: var(--text); }

    .portal-login input {
      font: inherit;
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #ffffff;
      color: var(--ink);
    }

    .portal-login input:focus { outline: 2px solid var(--primary-soft); border-color: var(--primary); }

    .submit, button.submit {
      justify-self: start;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 16px;
      border: none;
      border-radius: 999px;
      background: var(--primary);
      color: #ffffff;
      padding: 12px 26px;
      font: inherit;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }

    .submit:hover { background: #0a2e41; }
    .submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .form-error {
      margin: 12px 0 0;
      color: var(--danger);
      font-size: 13.5px;
      font-weight: 600;
    }

    .form-error[hidden] { display: none; }

    /* Honeypot: visually removed, still present for bots that fill every field. */
    .field-website {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    .portal-note { margin: 14px 0 0; color: var(--text); font-size: 13.5px; line-height: 1.55; }
    .portal-note a { color: var(--primary); font-weight: 700; }

    /* --------------------------------------------------- the dashboard */

    .portal-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 0 0 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
      color: var(--text);
      font-size: 13.5px;
    }

    .portal-bar b { color: var(--ink); }

    .portal-bar button {
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--ink);
      padding: 7px 16px;
      cursor: pointer;
    }

    .portal-bar button:hover { border-color: var(--primary); color: var(--primary); }

    .section { margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--line); }

    .portal-app-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .portal-app-head h2 {
      margin: 0;
      font-family: "Sora", system-ui, sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
    }

    .portal-chip {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 4px 10px;
      border-radius: 999px;
      background: #e8eef1;
      color: var(--primary);
      white-space: nowrap;
    }

    .portal-chip.is-new { background: #fbeee0; color: var(--accent); }
    .portal-chip.is-fee_pending { background: #fff3e0; color: #b26a00; }
    .portal-chip.is-screening { background: #e4e9f7; color: #3949ab; }
    .portal-chip.is-review { background: #ede7f6; color: #5e35b1; }
    .portal-chip.is-sent_to_landlord { background: #e0f2f1; color: #00695c; }
    .portal-chip.is-needs_info { background: #fff3e0; color: #b26a00; }
    .portal-chip.is-approved { background: #e3f2e6; color: #2e7d32; }
    .portal-chip.is-declined { background: #fdecea; color: var(--danger); }
    .portal-chip.is-lease_sent { background: #e1f5fe; color: #0277bd; }
    .portal-chip.is-lease_signed { background: #e3f2e6; color: #1b5e20; }

    .portal-facts { margin: 8px 0 0; color: var(--text); font-size: 13px; }

    .portal-progress {
      margin: 10px 0 0;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
    }

    .portal-progress.is-done { color: var(--good); }

    /* ----------------------------------------------------- the documents */

    .doc-list { display: grid; gap: 12px; margin-top: 14px; }

    .doc-type {
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: #fbfaf7;
      padding: 14px;
    }

    .doc-type-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .doc-label { font-size: 13.5px; font-weight: 700; color: var(--ink); }

    .doc-req {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text);
      margin-left: 6px;
      white-space: nowrap;
    }

    .doc-req.is-missing { color: var(--danger); }
    .doc-req.is-done { color: var(--good); }

    .doc-add {
      border: 1px dashed var(--primary);
      background: #ffffff;
      color: var(--primary);
      border-radius: 999px;
      padding: 7px 16px;
      font: inherit;
      font-weight: 700;
      font-size: 12.5px;
      cursor: pointer;
      white-space: nowrap;
    }

    .doc-add:hover { background: var(--primary-soft); }
    .doc-add:disabled { opacity: 0.55; cursor: not-allowed; }
    .doc-add:disabled:hover { background: #ffffff; }

    .doc-hint { margin: 8px 0 0; font-size: 12.5px; line-height: 1.5; color: var(--text); max-width: 560px; }

    .doc-files { list-style: none; margin: 10px 0 0; padding: 0; display: grid; }

    .doc-file {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 13px;
      border-top: 1px solid var(--line);
      padding: 8px 0 7px;
    }

    .doc-file a { color: var(--primary); font-weight: 600; text-decoration: none; overflow-wrap: anywhere; }
    .doc-file a:hover { text-decoration: underline; }
    .doc-size { font-size: 12px; color: var(--text); }

    .doc-remove {
      margin-left: auto;
      border: none;
      background: none;
      color: var(--danger);
      font: inherit;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      padding: 4px 6px;
    }

    .doc-remove:hover { text-decoration: underline; }

    @media (max-width: 1024px) {
      .desktop-nav { display: none; }

      .menu-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
    }

    @media (max-width: 640px) {
      .sheet { padding: 20px; }
    }

    @media (max-width: 560px) {
      .site { padding: 14px 12px 60px; }
      .topbar { padding: 8px 10px; }
      .brand-mark { width: 48px; height: 48px; }
      .brand-copy h1 { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="site">
    <!-- SHARED_HEADER {"depth": 1, "currentNav": "portal"} -->

    <main class="sheet" id="portal">
      <p class="state">Loading…</p>
    </main>
  </div>

  <script src="portal.js"></script>
  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const mobileNav = document.querySelector('.mobile-nav');
    const closeButton = document.querySelector('.close-nav');
    const mobileLinks = document.querySelectorAll('.mobile-sheet a');

    function openNav() {
      mobileNav?.classList.add('open');
      mobileNav?.setAttribute('aria-hidden', 'false');
      menuToggle?.setAttribute('aria-expanded', 'true');
      document.body.classList.add('nav-open');
    }

    function closeNav() {
      mobileNav?.classList.remove('open');
      mobileNav?.setAttribute('aria-hidden', 'true');
      menuToggle?.setAttribute('aria-expanded', 'false');
      document.body.classList.remove('nav-open');
    }

    menuToggle?.addEventListener('click', () => {
      if (mobileNav?.classList.contains('open')) closeNav();
      else openNav();
    });

    closeButton?.addEventListener('click', closeNav);

    mobileNav?.addEventListener('click', (event) => {
      if (event.target === mobileNav) closeNav();
    });

    mobileLinks.forEach((link) => {
      link.addEventListener('click', closeNav);
    });
  </script>
</body>
</html>
