<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply | Star Real Estate</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1f2a33;
      --text: #4c5963;
      --bg: #f7f6f1;
      --panel: #ffffff;
      --line: rgba(31, 42, 51, 0.14);
      --primary: #0d3b52;
      --primary-soft: #dce9ef;
      --accent: #c1752e;
      --page-bg-image: url("../jpg/unit-bkg.jpeg");
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --shadow: 0 20px 38px rgba(13, 59, 82, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Public Sans", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background: var(--page-bg-image) center / cover fixed no-repeat;
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -32px;
      z-index: 0;
      pointer-events: none;
      background: var(--page-bg-image) center / cover fixed no-repeat;
      filter: blur(7px) saturate(1.04);
      opacity: 0.58;
      transform: scale(1.018);
    }

    body.nav-open { overflow: hidden; }

    .site {
      max-width: 1160px;
      margin: 0 auto;
      padding: 22px 18px 70px;
      overflow-x: clip;
      position: relative;
      z-index: 1;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(12, 31, 40, 0.46);
      border-radius: 18px;
      box-shadow: 0 18px 34px rgba(12, 31, 40, 0.14);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      text-decoration: none;
      color: #ffffff;
    }

    .brand-mark {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 14px 26px rgba(12, 31, 40, 0.2);
      overflow: hidden;
      flex-shrink: 0;
    }

    .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.2);
    }

    .brand-copy h1 {
      margin: 0;
      font-family: "Sora", sans-serif;
      font-size: 20px;
      line-height: 1.15;
      text-transform: uppercase;
      letter-spacing: 0.25px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }

    .desktop-nav {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .desktop-nav a {
      text-decoration: none;
      color: rgba(255, 255, 255, 0.78);
      padding: 0 16px;
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      isolation: isolate;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
    }

    .desktop-nav a:hover,
    .desktop-nav a[aria-current="page"] {
      background: transparent;
      color: #ffffff;
    }

    .desktop-nav a::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: calc(100% - 14px);
      min-width: 46px;
      height: 30px;
      border-radius: 10px;
      background: transparent;
      transform: translate(-50%, -50%);
      transition: background-color 180ms ease;
      z-index: -1;
    }

    .desktop-nav a:hover::before,
    .desktop-nav a[aria-current="page"]::before {
      background: rgba(255, 255, 255, 0.14);
    }

    .desktop-nav a.intent-nav {
      min-width: 76px;
      padding: 0 18px;
      text-align: center;
    }

    .menu-toggle {
      display: none;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      font-size: 18px;
      cursor: pointer;
    }

    .mobile-nav {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(31, 42, 51, 0.62);
      padding: 16px;
      align-items: center;
      justify-content: center;
    }

    .mobile-nav.open {
      display: flex;
    }

    .mobile-sheet {
      width: min(360px, 100%);
      background: rgba(12, 31, 40, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 15px;
      padding: 14px;
      box-shadow: var(--shadow);
      display: grid;
      gap: 8px;
    }

    .mobile-sheet a,
    .close-nav {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      padding: 10px 12px;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.82);
      font-size: 13px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.08);
      text-align: left;
    }

    .mobile-sheet a[aria-current="page"] {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
    }

    .mobile-sheet a.intent-nav {
      min-height: 48px;
      padding: 14px;
      font-size: 14px;
      font-weight: 800;
    }

    .close-nav {
      cursor: pointer;
      font-family: inherit;
      color: #ffffff;
    }

    .breadcrumb {
      max-width: 860px;
      margin: 22px auto 14px;
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(12, 31, 40, 0.5);
    }

    .breadcrumb a { color: #ffffff; text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }

    .sheet {
      max-width: 860px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 26px;
    }

    .state {
      padding: 40px 12px;
      text-align: center;
      color: var(--text);
      font-weight: 600;
    }

    .listing-summary {
      padding: 14px 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: #fbfaf7;
      margin-bottom: 22px;
    }

    .listing-summary .price {
      font-family: "Sora", system-ui, sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: var(--primary);
      margin: 0;
    }

    .listing-summary h2 { margin: 2px 0 2px; font-size: 16px; }
    .listing-summary p { margin: 0; color: var(--text); font-size: 13.5px; }

    .sheet h1 {
      font-family: "Sora", system-ui, sans-serif;
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 6px;
      line-height: 1.25;
      color: var(--primary);
    }

    .lede { margin: 0 0 20px; color: var(--text); font-size: 14.5px; line-height: 1.55; }

    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .grid .wide { grid-column: 1 / -1; }

    label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 5px; }
    .hint { font-weight: 400; color: var(--text); }

    input, textarea {
      font: inherit;
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #ffffff;
      color: var(--ink);
    }

    textarea { min-height: 110px; resize: vertical; }
    input:focus, textarea:focus { outline: 2px solid var(--primary-soft); border-color: var(--primary); }

    /* The native date input shows a locale format hint (e.g. mm/dd/yyyy)
       while empty; hide it until the visitor picks or types a date so the
       empty field stays clean. The calendar icon and picker still work. */
    input[type="date"] { min-height: 41px; }

    input[type="date"]:not(.has-value):not(:focus)::-webkit-datetime-edit {
      color: transparent;
    }

    /* Honeypot: visually removed, still present for bots that fill every field. */
    .field-website {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    .turnstile-box { margin-top: 18px; }

    .privacy-note {
      margin: 18px 0 0;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 12.5px;
      line-height: 1.55;
    }

    .form-actions { margin-top: 20px; }

    .submit {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 999px;
      background: var(--primary);
      color: #ffffff;
      padding: 13px 28px;
      font: inherit;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }

    .submit:hover { background: #0a2e41; }
    .submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .form-error {
      margin: 14px 0 0;
      color: #b3261e;
      font-size: 13.5px;
      font-weight: 600;
    }

    .form-error[hidden] { display: none; }

    .success {
      text-align: center;
      padding: 30px 12px;
    }

    .success h2 { font-family: "Sora", system-ui, sans-serif; color: var(--primary); margin: 0 0 8px; }
    .success p { color: var(--text); margin: 0 0 18px; line-height: 1.6; }

    .success a {
      display: inline-flex;
      border-radius: 999px;
      background: var(--primary);
      color: #ffffff;
      padding: 10px 18px;
      text-decoration: none;
      font-weight: 800;
      font-size: 14px;
    }

    @media (max-width: 1024px) {
      .desktop-nav {
        display: none;
      }

      .menu-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
    }

    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
      .sheet { padding: 20px; }
    }

    @media (max-width: 560px) {
      .site {
        padding: 14px 12px 60px;
      }

      .topbar {
        padding: 8px 10px;
      }

      .brand-mark {
        width: 48px;
        height: 48px;
      }

      .brand-copy h1 {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="site">
    <!-- SHARED_HEADER {"depth": 1, "currentNav": null} -->

    <p class="breadcrumb"><a id="back-link" href="../rental/">← Back to the property</a></p>

    <main class="sheet" id="apply">
      <p class="state">Loading…</p>
    </main>
  </div>

  <template id="form-template">
    <div class="listing-summary" id="listing-summary" hidden>
      <p class="price" id="summary-price"></p>
      <h2 id="summary-title"></h2>
      <p id="summary-address"></p>
    </div>

    <h1>Apply for this home</h1>
    <p class="lede">Tell us a little about yourself and we will follow up with the next steps. Fields marked * are required.</p>

    <form id="apply-form" novalidate>
      <div class="grid">
        <div>
          <label for="name">Full name *</label>
          <input id="name" name="name" maxlength="120" autocomplete="name" required>
        </div>

        <div>
          <label for="email">Email *</label>
          <input id="email" name="email" type="email" maxlength="180" autocomplete="email" required>
        </div>

        <div>
          <label for="phone">Phone</label>
          <input id="phone" name="phone" maxlength="60" autocomplete="tel">
        </div>

        <div>
          <label for="move_in">Desired move-in *</label>
          <input id="move_in" name="move_in" type="date" required>
        </div>

        <div>
          <label for="household_size">Household size * <span class="hint">(number of occupants)</span></label>
          <input id="household_size" name="household_size" type="number" min="1" max="20" step="1" inputmode="numeric" required>
        </div>

        <div>
          <label for="income_note">Annual income * <span class="hint">(e.g. $120,000)</span></label>
          <input id="income_note" name="income_note" maxlength="300" required>
        </div>

        <div class="wide">
          <label for="message">Anything else you would like us to know?</label>
          <textarea id="message" name="message" maxlength="2000"></textarea>
        </div>
      </div>

      <div class="field-website" aria-hidden="true">
        <label for="website">Website</label>
        <input id="website" name="website" tabindex="-1" autocomplete="off">
      </div>

      <div class="turnstile-box" id="turnstile-box"></div>

      <p class="privacy-note">
        We only collect the information you enter on this form, and we will never ask for your SSN or
        financial documents here. What you submit is encrypted and visible only to the Star Real Estate
        team. We use it solely to process this application and delete it once it is no longer needed.
      </p>

      <div class="form-actions">
        <button type="submit" class="submit" id="submit-button">Submit application</button>
      </div>
      <p class="form-error" id="form-error" hidden></p>
    </form>
  </template>

  <script src="apply.js"></script>
  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const mobileNav = document.querySelector('.mobile-nav');
    const closeButton = document.querySelector('.close-nav');
    const mobileLinks = document.querySelectorAll('.mobile-sheet a');

    function openNav() {
      mobileNav?.classList.add('open');
      mobileNav?.setAttribute('aria-hidden', 'false');
      menuToggle?.setAttribute('aria-expanded', 'true');
      document.body.classList.add('nav-open');
    }

    function closeNav() {
      mobileNav?.classList.remove('open');
      mobileNav?.setAttribute('aria-hidden', 'true');
      menuToggle?.setAttribute('aria-expanded', 'false');
      document.body.classList.remove('nav-open');
    }

    menuToggle?.addEventListener('click', () => {
      if (mobileNav?.classList.contains('open')) closeNav();
      else openNav();
    });

    closeButton?.addEventListener('click', closeNav);

    mobileNav?.addEventListener('click', (event) => {
      if (event.target === mobileNav) closeNav();
    });

    mobileLinks.forEach((link) => {
      link.addEventListener('click', closeNav);
    });
  </script>
</body>
</html>
